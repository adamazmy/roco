[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "roco"
version = "0.1.0"
description = "ROCO: a local-first voice assistant for a small desktop robot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Adam Azmy" }]
keywords = ["assistant", "robot", "voice", "ollama", "raspberry-pi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
# Core = text mode only. Everything heavy lives in extras.
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13.0",  # brain <-> body link (sync API)
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
voice = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "livekit>=1.0",  # WebRTC AEC for barge-in in `roco run` (docs/AEC.md)
]
face = ["pygame>=2.5"]
# Phase 3 split. The PC brain server runs STT + TTS; the Pi body client runs the mic,
# wake word, VAD, playback and face. Workstreams add their libraries (AEC, Kokoro,
# anthropic) to these lists. `voice` stays as "both", for `roco run` on one machine.
brain = ["numpy>=1.26", "faster-whisper>=1.0.0", "piper-tts>=1.2.0"]
# livekit = WebRTC AudioProcessingModule (AEC3) for barge-in, see docs/AEC.md.
# piper-tts = local voice for fallback replies (loaded only when the brain is down).
body = [
    "numpy>=1.26", "sounddevice>=0.4.6", "openwakeword>=0.6.0", "onnxruntime>=1.17",
    "livekit>=1.0", "piper-tts>=1.2.0",
]
google = [
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
outlook = ["msal>=1.28"]
# Fallback brain on the body (roco.fallback): Claude + whisper tiny.en for STT.
cloud = ["anthropic>=2.0", "numpy>=1.26", "faster-whisper>=1.0.0"]
pi = ["adafruit-circuitpython-servokit>=1.3"]
# anthropic: so CI runs the Claude client tests against the real SDK over a mocked
# HTTP transport (no network). It is pure Python and light.
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.5", "anthropic>=2.0"]
# Everything you want on the Windows "brain" PC. `pi` is deliberately excluded.
all = ["roco[voice,face,google,outlook,dev,brain,body,cloud]"]

[project.scripts]
roco = "roco.cli:main"

[project.urls]
Homepage = "https://github.com/adamazmy/roco"
Issues = "https://github.com/adamazmy/roco/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/roco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 30
markers = [
    "ollama: needs a real Ollama server (skipped in CI)",
    "hardware: needs a mic, speaker, display or servos (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Interfaces deliberately ship optional no-op hooks (close, stop, release).
ignore = ["B027"]
